<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickServe - Sign Up</title>

  <!-- fontawesome cdn -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />

  <!-- bootstrap cdn -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <link rel="stylesheet" href="./style.css">
</head>
<body class="auth-body">

  <div class="auth-card">
    <!-- Back to Home Button -->
    <a href="./index.html" class="btn-back-home">
      <i class="fa-solid fa-arrow-left"></i> Back to Home
    </a>

    <div class="auth-header text-center">
      <h3 class="brand-title">QUICK<span>SERVE</span></h3>
      <p class="text-muted small">Create your account to get started</p>
    </div>

    <!-- Google Signup Button -->
    <button type="button" class="btn btn-google w-100 mb-3" id="googleSignupBtn">
      <i class="fa-brands fa-google me-2"></i> Sign up with Google
    </button>

    <div class="auth-divider mb-3">
      <span>OR</span>
    </div>

    <form id="signupForm">
      <div class="mb-3">
        <label class="form-label text-white-50">Full Name</label>
        <input type="text" id="signupName" class="form-control auth-input" placeholder="Enter your full name" required>
      </div>

      <div class="mb-3">
        <label class="form-label text-white-50">Email Address</label>
        <input type="email" id="signupEmail" class="form-control auth-input" placeholder="name@example.com" required>
      </div>

      <div class="mb-3">
        <label class="form-label text-white-50">Password</label>
        <input type="password" id="signupPassword" class="form-control auth-input" placeholder="Create password" required>
      </div>

      <div class="mb-4">
        <label class="form-label text-white-50">Select Account Type</label>
        <select id="signupRole" class="form-select auth-input" required>
          <option value="" disabled selected>Select Role</option>
          <option value="customer">Customer (Looking for services)</option>
          <option value="provider">Service Provider (Offering services)</option>
        </select>
      </div>

      <button type="submit" class="btn btn-orange-glow w-100 py-2">Sign Up</button>
    </form>

    <div class="auth-footer text-center mt-4">
      <span class="text-muted small">Already have an account? </span>
      <a href="./login.html" class="auth-link">Login Here</a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script>

  <!-- Firebase Script Integration -->
  <script type="module" src="./signup.js"></script>
</body>
</html>
