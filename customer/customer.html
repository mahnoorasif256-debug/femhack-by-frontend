<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Dashboard - QuickServe</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

      <!--fontawesome cdn  -->

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../style.css">
<style>
  body{
    background-color:#0f172a;
    color:#e2e8f0;
    font-family:'Inter', sans-serif;
    min-height:100vh;
  }
  .stat-card{
    background: linear-gradient(180deg, rgba(30,41,59,0.9) 0%, rgba(15,23,42,0.95) 100%);
    border:1px solid rgba(255,255,255,0.08);
    border-radius:16px;
    padding:20px;
    transition: transform .25s ease, border-color .25s ease;
  }
  .stat-card:hover{ transform:translateY(-4px); border-color: rgba(245,158,11,0.4); }
  .stat-icon{
    width:46px; height:46px; border-radius:12px;
    display:flex; align-items:center; justify-content:center;
    font-size:20px;
  }
  .booking-card{
    background: linear-gradient(180deg, rgba(30,41,59,0.85) 0%, rgba(15,23,42,0.95) 100%);
    border:1px solid rgba(255,255,255,0.08);
    border-radius:14px;
  }
  .booking-card:hover{ border-color: rgba(245,158,11,0.3); }
  .badge-status{
    font-weight:700; font-size:0.72rem; padding:6px 12px; border-radius:20px; letter-spacing:.3px;
  }
  .status-pending{ background:rgba(245,158,11,0.15); color:#f59e0b; border:1px solid rgba(245,158,11,0.4); }
  .status-accepted{ background:rgba(56,189,248,0.15); color:#38bdf8; border:1px solid rgba(56,189,248,0.4); }
  .status-progress{ background:rgba(167,139,250,0.15); color:#a78bfa; border:1px solid rgba(167,139,250,0.4); }
  .status-completed{ background:rgba(34,197,94,0.15); color:#22c55e; border:1px solid rgba(34,197,94,0.4); }
  .status-rejected{ background:rgba(248,113,113,0.15); color:#f87171; border:1px solid rgba(248,113,113,0.4); }
  .booking-id{ font-family:monospace; color:#94a3b8; font-size:0.78rem; }
  .filter-pill{
    border:1px solid rgba(255,255,255,0.15); background:transparent; color:#94a3b8;
    border-radius:20px; padding:6px 16px; font-size:0.82rem; font-weight:600; transition:.2s ease;
  }
  .filter-pill.active, .filter-pill:hover{ background:#f59e0b; color:#0f172a; border-color:#f59e0b; }
  .avatar-circle{
    width:40px; height:40px; border-radius:50%; background:#f59e0b; color:#0f172a;
    display:flex; align-items:center; justify-content:center; font-weight:800;
  }
  .star{ color:#f59e0b; cursor:pointer; font-size:1.4rem; }
  .empty-state{ color:#94a3b8; }
  .section-title{ font-weight:800; letter-spacing:.3px; }
</style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg bg-slate navbar-dark sticky-top">
  <div class="container">
    <a class="navbar-brand fw-bold brand-title" href="#">Quick<span>Serve</span></a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav1">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="nav1">
      <ul class="navbar-nav mx-auto">
        <li class="nav-item"><a class="nav-link" href="#">Browse Services</a></li>
        <li class="nav-item"><a class="nav-link active" style="color:#f59e0b" href="#">My Dashboard</a></li>
      </ul>
     <div class="d-flex align-items-center gap-3">
  <span class="d-none d-md-block text-white-50 small" id="userGreeting">Hi, User</span>
  <div class="avatar-circle" id="userAvatar">U</div>
  <a href="javascript:void(0);" class="btn btn-outline-light btn-sm rounded-pill px-3" id="logoutBtn">Logout</a>
</div>
    </div>
  </div>
</nav>

<div class="container py-4">

  <!-- Header -->
  <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
    <div>
      <h3 class="section-title mb-1">My Bookings</h3>
      <p class="text-white-50 mb-0 small">Track every request you've made, start to finish.</p>
    </div>
    <a href="../index.html" class="btn btn-warning fw-bold rounded-pill px-4"><i class="bi bi-plus-lg me-1"></i> New Booking</a>
  </div>

  <!-- Stat cards -->
  <div class="row g-3 mb-4">
    <div class="col-6 col-md-3">
      <div class="stat-card d-flex align-items-center gap-3">
        <div class="stat-icon" style="background:rgba(245,158,11,0.15); color:#f59e0b;"><i class="bi bi-hourglass-split"></i></div>
        <div>
          <div class="fs-4 fw-800" id="countPending">0</div>
          <div class="small text-white-50">Pending</div>
        </div>
      </div>
    </div>
    <div class="col-6 col-md-3">
      <div class="stat-card d-flex align-items-center gap-3">
        <div class="stat-icon" style="background:rgba(167,139,250,0.15); color:#a78bfa;"><i class="bi bi-arrow-repeat"></i></div>
        <div>
          <div class="fs-4 fw-800" id="countProgress">0</div>
          <div class="small text-white-50">In Progress</div>
        </div>
      </div>
    </div>
    <div class="col-6 col-md-3">
      <div class="stat-card d-flex align-items-center gap-3">
        <div class="stat-icon" style="background:rgba(34,197,94,0.15); color:#22c55e;"><i class="bi bi-check2-circle"></i></div>
        <div>
          <div class="fs-4 fw-800" id="countCompleted">0</div>
          <div class="small text-white-50">Completed</div>
        </div>
      </div>
    </div>
    <div class="col-6 col-md-3">
      <div class="stat-card d-flex align-items-center gap-3">
        <div class="stat-icon" style="background:rgba(56,189,248,0.15); color:#38bdf8;"><i class="bi bi-star-fill"></i></div>
        <div>
          <div class="fs-4 fw-800" id="countTotal">0</div>
          <div class="small text-white-50">Total Bookings</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Filters -->
  <div class="d-flex flex-wrap gap-2 mb-3" id="filterBar">
    <button class="filter-pill active" data-filter="all">All</button>
    <button class="filter-pill" data-filter="Pending">Pending</button>
    <button class="filter-pill" data-filter="Accepted">Accepted</button>
    <button class="filter-pill" data-filter="In Progress">In Progress</button>
    <button class="filter-pill" data-filter="Completed">Completed</button>
    <button class="filter-pill" data-filter="Rejected">Rejected</button>
  </div>

  <!-- Bookings list -->
  <div class="row g-3" id="bookingsList"></div>
  <div class="text-center py-5 empty-state d-none" id="emptyState">
    <i class="bi bi-inbox fs-1 d-block mb-2"></i>
    No bookings match this filter.
  </div>
</div>

<!-- Review Modal -->
<div class="modal fade" id="reviewModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content" style="background:#111c33; border:1px solid rgba(245,158,11,0.3); border-radius:16px;">
      <div class="modal-header border-0">
        <h5 class="modal-title text-white">Rate your experience</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <p class="text-white-50 small mb-3" id="reviewProviderName">Provider name</p>
        <div class="mb-3" id="starRow">
          <i class="bi bi-star star" data-val="1"></i>
          <i class="bi bi-star star" data-val="2"></i>
          <i class="bi bi-star star" data-val="3"></i>
          <i class="bi bi-star star" data-val="4"></i>
          <i class="bi bi-star star" data-val="5"></i>
        </div>
        <textarea class="form-control auth-input" rows="3" placeholder="Share a few words about the service..." id="reviewText"></textarea>
      </div>
      <div class="modal-footer border-0">
        <button class="btn btn-outline-light rounded-pill" data-bs-dismiss="modal">Cancel</button>
        <button class="btn btn-warning fw-bold rounded-pill" id="submitReview">Submit Review</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script type="module" src="./customer.js"></script>
</body>
</html>
